name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest

  dogfood:
    name: this repository passes its own guards, and the recorded tour still matches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: docsguard check
      - run: docsguard budget
      # The tour on the landing page is the real command line, recorded. If the tool's output changes, this fails.
      - run: python scripts/record_transcripts.py --check

  mutation:
    name: every guard, and every door in front of the lab, is proven by sabotage
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/sabotage.py

  package:
    name: the built wheel installs and initialises a repository that passes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --wheel
      - name: Install into a clean environment and run end to end
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/docsguard init /tmp/demo --name demo
          /tmp/clean/bin/docsguard check --root /tmp/demo

  image:
    name: images build and run (the guards from a container, and the lab behind a black-box smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build check
      - run: TARGET=. docker compose run --rm check
      - name: Start the lab (make playground) and drive every guard and both gates through its HTTP API
        run: |
          docker compose up --build --wait -d playground
          scripts/smoke.sh http://localhost:8200
      - name: The lab refuses to start in production
        run: |
          set +e
          docker run --rm -e DG_LAB=1 -e DG_ENV=production docsguard-playground:local
          status=$?
          test "$status" -eq 2
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v

  browser:
    name: Browser (landing, lab, 14 languages; Playwright + axe)
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The same command a reviewer runs locally: builds the container with the lab on and drives it with Playwright.
      - name: make e2e
        run: make e2e
        env:
          CI: "true"
      - name: Test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: browser-test-results, path: e2e/test-results, if-no-files-found: ignore }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v

  security:
    name: Security (secrets, Dockerfile, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The binary, pinned and checksum-verified, instead of gitleaks-action: the action scans "<first commit>^..HEAD",
      # and the first commit of a new repository has no parent, so it fails on the very first push.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.24.3
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          archive=gitleaks_${v}_linux_x64.tar.gz # keep the release's file name: the checksum list refers to it
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt" | grep -F "$archive: OK"
          tar xzf "$archive" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact -v .
      - name: Lint the Dockerfile (both images)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

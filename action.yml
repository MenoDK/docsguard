name: docsguard
description: Check that a repository's docs map, ADRs, handoff and session-start instructions are whole.
inputs:
  root:
    description: Repository root to check.
    default: "."
  staged:
    description: Also run the same-commit rule against the staged change ("true" or "false").
    default: "false"
  python-version:
    description: Python version to run the guards with.
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install docsguard
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check
      shell: bash
      env:
        DOCSGUARD_ROOT: ${{ inputs.root }}
        DOCSGUARD_STAGED: ${{ inputs.staged }}
      run: |
        args=(check --root "$DOCSGUARD_ROOT")
        if [ "$DOCSGUARD_STAGED" = "true" ]; then args+=(--staged); fi
        docsguard "${args[@]}"
